name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Prepare minimal deployment directory
        run: |
          mkdir -p public-site
          
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install gong
        run: go install ./go/cmd/gong

      - name: Build process portable app
        run: |
          cd dsm/process/go/cmd/process
          gong portable
          cp process-app-portable.html ../../../../../public-site/
          zip ../../../../../public-site/process-app-portable.zip process-app-portable.html

      - name: Build reqif portable app
        run: |
          cd app/reqif/go/cmd/reqif
          gong portable
          cp reqif-app-portable.html ../../../../../public-site/
          zip ../../../../../public-site/reqif-app-portable.zip reqif-app-portable.html
          
      - name: Build statemachines portable app
        run: |
          cd dsm/statemachines/go/cmd/statemachines
          gong portable
          cp statemachines-app-portable.html ../../../../../public-site/
          zip ../../../../../public-site/statemachines-app-portable.zip statemachines-app-portable.html
          
      - name: Build barrgraph portable app
        run: |
          cd dsm/barrgraph/go/cmd/barrgraph
          gong portable
          cp barrgraph-app-portable.html ../../../../../public-site/
          zip ../../../../../public-site/barrgraph-app-portable.zip barrgraph-app-portable.html

      - name: Build phylla portable app
        run: |
          cd dsm/phylla/go/cmd/phylla
          gong portable
          cp phylla-app-portable.html ../../../../../public-site/
          zip ../../../../../public-site/phylla-app-portable.zip phylla-app-portable.html

      - name: Build capture portable app
        run: |
          cd dsm/capture/go/cmd/capture
          gong portable
          cp capture-app-portable.html ../../../../../public-site/
          zip ../../../../../public-site/capture-app-portable.zip capture-app-portable.html

      - name: Build structure portable app
        run: |
          cd dsm/structure/go/cmd/structure
          gong portable
          cp structure-app-portable.html ../../../../../public-site/
          zip ../../../../../public-site/structure-app-portable.zip structure-app-portable.html

      - name: Build scenario portable app
        run: |
          cd dsm/scenario/go/cmd/scenario
          gong portable
          cp scenario-app-portable.html ../../../../../public-site/
          zip ../../../../../public-site/scenario-app-portable.zip scenario-app-portable.html
          
      - name: Build floss portable app
        run: |
          cd dsm/floss/go/cmd/floss
          gong portable
          cp floss-app-portable.html ../../../../../public-site/
          zip ../../../../../public-site/floss-app-portable.zip floss-app-portable.html
          
      - name: Build project portable app
        run: |
          cd dsm/project/go/cmd/project
          gong portable
          cp project-app-portable.html ../../../../../public-site/
          zip ../../../../../public-site/project-app-portable.zip project-app-portable.html


      - name: Build svg portable app
        run: |
          cd lib/svg/go/cmd/svg
          gong portable
          cp svg-app-portable.html ../../../../../public-site/
          zip ../../../../../public-site/svg-app-portable.zip svg-app-portable.html

      - name: Build airspace portable app
        run: |
          cd app/xsd/tests/aixm/airspace/go/cmd/airspace
          gong portable
          cp airspace-app-portable.html ../../../../../../../../public-site/
          zip ../../../../../../../../public-site/airspace-app-portable.zip airspace-app-portable.html

      - name: Build navaid portable app
        run: |
          cd app/xsd/tests/aixm/navaid/go/cmd/navaid
          gong portable
          cp navaid-app-portable.html ../../../../../../../../public-site/
          zip ../../../../../../../../public-site/navaid-app-portable.zip navaid-app-portable.html

          
      - name: Setup Pages
        uses: actions/configure-pages@v6
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'public-site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for Pages artifact visibility
        uses: actions/github-script@v9
        with:
          script: |
            // Work around eventual-consistency delay in Actions ArtifactService/ListArtifacts
            // before actions/deploy-pages@v5 queries it once without retries
            // (see https://github.com/actions/deploy-pages/issues/451).
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            if (!token || !resultsUrl) {
              core.info('Artifact runtime env vars not exposed; skipping pre-check.');
              return;
            }

            let workflowRunBackendId = '';
            let workflowJobRunBackendId = '';
            try {
              const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
              const resultsScope = (payload.scp || '')
                .split(' ')
                .find(s => s.startsWith('Actions.Results:'));
              if (resultsScope) {
                const parts = resultsScope.split(':');
                workflowRunBackendId = parts[1] || '';
                workflowJobRunBackendId = parts[2] || '';
              }
            } catch (err) {
              core.warning(`Could not parse ACTIONS_RUNTIME_TOKEN claims: ${err.message}`);
              return;
            }

            if (!workflowRunBackendId || !workflowJobRunBackendId) {
              core.info('No Actions.Results scope found in runtime token; skipping pre-check.');
              return;
            }

            const endpoint = `${new URL(resultsUrl).origin}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts`;
            const delaysMs = [1000, 2000, 4000, 5000, 5000, 5000, 5000, 5000, 5000, 5000];

            for (let attempt = 1; attempt <= delaysMs.length + 1; attempt++) {
              const res = await fetch(endpoint, {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  workflow_run_backend_id: workflowRunBackendId,
                  workflow_job_run_backend_id: workflowJobRunBackendId,
                }),
              });

              if (!res.ok) {
                core.warning(`ListArtifacts returned HTTP ${res.status} on attempt ${attempt}; proceeding to deploy-pages.`);
                return;
              }

              const data = await res.json();
              const matched = (data.artifacts || []).filter(a => a.name === 'github-pages');
              if (matched.length > 0) {
                core.info(`Artifact "github-pages" visible in ArtifactService on attempt ${attempt}.`);
                return;
              }

              if (attempt <= delaysMs.length) {
                const delay = delaysMs[attempt - 1];
                core.info(`Artifact "github-pages" not yet visible (attempt ${attempt}/${delaysMs.length + 1}); retrying in ${delay}ms...`);
                await new Promise(resolve => setTimeout(resolve, delay));
              }
            }

            core.warning('Artifact "github-pages" was not visible after retries; proceeding to deploy-pages for final check.');

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
